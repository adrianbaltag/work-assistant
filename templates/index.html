<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Work Assistant</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <div class="app">
    <nav class="side" aria-label="App sections">
      <div class="brand"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>Work Assistant</div>
      <button class="nav" data-page="dash" aria-current="page"><span class="ico">▦</span>Dashboard</button>
      <button class="nav claude" data-page="ask"><span class="ico">✳</span>Ask Claude</button>
      <button class="nav" data-page="archive"><span class="ico">▤</span>Archive</button>
      <div class="slack-wrap"><button class="nav slack" id="nav-slack" aria-haspopup="true" aria-expanded="false" aria-controls="slack-dd"><span class="ico">#</span><span id="slack-label">Slack</span><span class="badge" id="slack-n" hidden></span></button>
        <div class="slack-dd" id="slack-dd" hidden></div></div>
      <div class="side-label">Coming later</div>
      <button class="nav" disabled><span class="ico">✉</span>Morning brief<span class="v">v3</span></button>
      <button class="nav" disabled><span class="ico">◷</span>Calendar<span class="v">v3</span></button>
    </nav>

    <section class="content" id="page-dash">
      <div class="dash-head">
        <div>
          <div class="date" id="date"></div>
          <h2>Your projects</h2>
          <p class="summary" id="summary"></p>
        </div>
        <div class="actions">
          <button class="btn claude" data-page="ask">✳ Ask Claude</button>
          <button class="btn primary" id="new-project">+ New project</button>
        </div>
      </div>
      <div class="seg" role="tablist" id="tabs"></div>
      <div id="list"></div>
    </section>

    <section class="content" id="page-ask" hidden>
      <div class="dash-head">
        <div>
          <div class="date">Reads the note of every open project</div>
          <h2>Ask Claude</h2>
          <p class="summary">For sessions and raw files, ask in the project's card.</p>
        </div>
      </div>
      <div class="ask-box" id="ask-chat"></div>
    </section>

    <section class="content" id="page-archive" hidden>
      <div class="dash-head">
        <div>
          <div class="date">Nothing is ever deleted</div>
          <h2>Archive</h2>
          <p class="summary">Finished projects and deleted files. Restore brings any of them back.</p>
        </div>
      </div>
      <div id="arch-alert"></div>
      <div id="arch-list"></div>
    </section>
  </div>

  <div class="overlay" id="ov" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <header class="m-head" id="m-head"></header>
      <div class="m-body">
        <aside class="col" id="m-tree" aria-label="Project files"></aside>
        <section class="col" id="m-view"></section>
        <aside class="col" id="m-claude" aria-label="Ask Claude"></aside>
      </div>
    </div>
  </div>
  <div class="overlay" id="np" hidden>
    <form class="modal small" id="np-form" role="dialog" aria-modal="true" aria-labelledby="np-title-h">
      <header class="m-head"><div class="t"><div class="path">projects\&lt;ID&gt;\</div><h2 id="np-title-h">New project</h2></div>
        <button type="button" class="x" id="np-cancel" aria-label="Close">×</button></header>
      <div class="np-body">
        <label>Ticket ID or short name <span class="hint">Becomes the folder name, never renamed. Spaces become _</span>
          <input id="np-id" required autocomplete="off" placeholder="ABC-123"></label>
        <label>Project name <span class="hint">Optional. Empty = same as the ID. You can change it later.</span>
          <input id="np-title" autocomplete="off"></label>
        <label>Status
          <select id="np-status"><option>active</option><option>pending</option><option>idea</option></select></label>
        <label class="np-check"><input type="checkbox" id="np-work" {{ "checked" if work_jira else "disabled" }}>
          <span>Work project
          <span class="hint">{% if work_jira %}Also makes work_jira\&lt;ID&gt;\ so Claude sets it up and keeps this card in sync. Untick for personal ideas.{% else %}Greyed: add work_jira_folder= to settings.ini to use it.{% endif %}</span></span></label>
        <div class="np-work-fields" id="np-work-fields"{% if not work_jira %} hidden{% endif %}>
          <label>Created by <span class="hint">Optional. Who opened the ticket.</span>
            <input id="np-by" autocomplete="off"></label>
          <label>Ticket description <span class="hint">Optional. Paste it from Jira: Claude reads it from ticket.md.</span>
            <textarea id="np-desc" rows="5"></textarea></label>
        </div>
        <div id="np-alert"></div>
        <div class="row"><button class="btn primary" type="submit" id="np-create">Create</button></div>
      </div>
    </form>
  </div>
  <div class="toast" id="toast" hidden role="status"></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script src="{{ url_for('static', filename='chat.js') }}"></script>
  <script src="{{ url_for('static', filename='card.js') }}"></script>
  <script src="{{ url_for('static', filename='archive.js') }}"></script>
  <script src="{{ url_for('static', filename='newproject.js') }}"></script>
  <script src="{{ url_for('static', filename='slack.js') }}"></script>
</body>
</html>
