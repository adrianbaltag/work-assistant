<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Work Assistant</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <div class="app">
    <nav class="side" aria-label="App sections">
      <div class="brand"><span class="logo" aria-hidden="true"><span class="bars"><i></i><i></i><i></i></span></span>Work Assistant</div>
      <!-- Icons: small line drawings (16px), coloured by the text colour. aria-hidden = screen readers skip them. -->
      <button class="nav" data-page="dash" aria-current="page">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></svg>Dashboard</button>
      <button class="nav" data-page="todo">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="3"/><path d="M5.6 8.2l1.7 1.7 3.2-3.5"/></svg>To do<span class="nbadge" id="todo-n" hidden></span></button>
      <button class="nav" data-page="ideas">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.8 11.5h4.4M6.4 14h3.2M8 1.8a4.4 4.4 0 0 0-2.6 8c.4.3.6.8.6 1.2v.5h4V11c0-.4.2-.9.6-1.2A4.4 4.4 0 0 0 8 1.8z"/></svg>Ideas</button>
      <button class="nav claude" data-page="ask">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2.8 5l10.4 6M2.8 11l10.4-6"/></svg>Ask Claude</button>
      <div class="slack-wrap"><button class="nav slack" id="nav-slack" aria-haspopup="true" aria-expanded="false" aria-controls="slack-dd">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.3 2.5l-1.1 11M10.8 2.5l-1.1 11M2.8 6h11M2.2 10h11"/></svg><span id="slack-label">Slack</span><span class="badge" id="slack-n" hidden></span></button>
        <div class="slack-dd" id="slack-dd" hidden></div></div>
      <div class="later">
        <div class="lbl">Coming later</div>
        <button class="nav" type="button" disabled aria-disabled="true">
          <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3.5" width="12" height="9" rx="1.5"/><path d="M2.5 4.5L8 9l5.5-4.5"/></svg>Morning brief</button>
        <button class="nav" type="button" disabled aria-disabled="true">
          <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5.5 1.8v2.4M10.5 1.8v2.4"/></svg>Calendar</button>
      </div>
    </nav>

    <main class="main">
    <section class="content" id="page-dash">
      <div class="dash-head">
        <div>
          <div class="date" id="date"></div>
          <h2>Your projects</h2>
          <p class="summary" id="summary"></p>
        </div>
        <div class="actions">
          <button class="btn claude" data-page="ask">✳ Ask Claude</button>
          <button class="btn primary" id="new-project">+ New project</button>
        </div>
      </div>
      <div class="tiles" role="tablist" id="tabs"></div>
      <div class="toolbar">
        <label class="search">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="dash-q" placeholder="Search name, ticket, working on, next step…" aria-label="Search projects" autocomplete="off">
        </label>
        <select id="dash-status" autocomplete="off" aria-label="Status filter">
          <option value="">Any status</option><option value="active">Active</option>
          <option value="pending">Pending</option>
        </select>
        <select id="dash-prio" autocomplete="off" aria-label="Priority filter">
          <option value="">Any priority</option><option value="critical">Critical</option>
          <option value="high">High</option><option value="normal">Normal</option>
        </select>
        <button class="linkbtn" id="dash-clear" hidden>Clear filters</button>
      </div>
      <div id="dash-alert"></div>
      <div id="list"></div>
    </section>

    <section class="content" id="page-todo" hidden>
      <div class="dash-head">
        <div>
          <div class="date" id="todo-date"></div>
          <h2>To do</h2>
          <p class="summary" id="todo-summary"></p>
        </div>
      </div>
      <div class="todo-col">
        <form class="todo-add" id="todo-add" autocomplete="off">
          <textarea id="todo-new" rows="1" maxlength="{{ todo_max }}" placeholder="Add a todo…" aria-label="New todo"></textarea>
          <button class="btn primary" type="submit">Add</button>
        </form>
        <div id="todo-alert"></div>
        <div class="todo-col" id="todo-list" data-empty-msg="{{ todo_empty }}" data-max-length="{{ todo_max }}"></div>
      </div>
    </section>

    <!-- Ideas page (ideas.js): quick box on top, the ideas below, newest first. Kept in ideas.md. -->
    <section class="content" id="page-ideas" hidden>
      <div class="dash-head">
        <div>
          <div class="date" id="ideas-date"></div>
          <h2>Ideas</h2>
          <p class="summary" id="ideas-summary"></p>
        </div>
      </div>
      <div class="todo-col">
        <form class="todo-add" id="idea-add" autocomplete="off">
          <textarea id="idea-new" rows="1" maxlength="{{ idea_max }}" aria-label="New idea"
            placeholder="Type an idea… First line = its name. Shift+Enter = new line, Enter = save"></textarea>
          <button class="btn primary" type="submit">Add</button>
          <!-- (i) button: shows or hides the line below it -->
          <button class="ticon info" type="button" id="idea-info" aria-expanded="false" aria-controls="idea-help"
            aria-label="How to change an idea" title="How to change an idea">
            <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.2v4"/><circle class="dot" cx="8" cy="4.9" r=".4"/></svg></button>
        </form>
        <p class="idea-help" id="idea-help" hidden>To change an idea, delete it and add it again.</p>
        <div id="idea-alert"></div>
        <div id="idea-list"></div>
      </div>
    </section>

    <section class="content" id="page-ask" hidden>
      <div class="dash-head">
        <div>
          <div class="date">Reads the note of every open project</div>
          <h2>Ask Claude</h2>
          <p class="summary">For sessions and raw files, ask in the project's card.</p>
        </div>
      </div>
      <div class="ask-box" id="ask-chat"></div>
    </section>

    </main>
  </div>

  <div class="overlay" id="ov" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <header class="m-head" id="m-head"></header>
      <div class="m-body">
        <aside class="col" id="m-tree" aria-label="Project files"></aside>
        <section class="col" id="m-view"></section>
        <aside class="col" id="m-claude" aria-label="Ask Claude"></aside>
      </div>
    </div>
  </div>
  <div class="overlay" id="np" hidden>
    <form class="modal small" id="np-form" role="dialog" aria-modal="true" aria-labelledby="np-title-h">
      <header class="m-head"><div class="t"><div class="path">projects\&lt;ID&gt;\</div><h2 id="np-title-h">New project</h2></div>
        <button type="button" class="x" id="np-cancel" aria-label="Close">×</button></header>
      <div class="np-body">
        <label>Ticket ID or short name <span class="hint">Becomes the folder name, never renamed. Spaces become _</span>
          <input id="np-id" required autocomplete="off" placeholder="ABC-123"></label>
        <label>Project name <span class="hint">Optional. Empty = same as the ID. You can change it later.</span>
          <input id="np-title" autocomplete="off"></label>
        <label>Status
          <select id="np-status"><option>active</option><option>pending</option></select></label>
        <label class="np-check"><input type="checkbox" id="np-work" {{ "checked" if work_jira else "disabled" }}>
          <span>Work project
          <span class="hint">{% if work_jira %}Also makes work_jira\&lt;ID&gt;\ so Claude sets it up and keeps this card in sync. Untick for personal projects.{% else %}Greyed: {{ work_jira_problem }}{% endif %}</span></span></label>
        <div class="np-work-fields" id="np-work-fields"{% if not work_jira %} hidden{% endif %}>
          <label>Created by <span class="hint">Optional. Who opened the ticket.</span>
            <input id="np-by" autocomplete="off"></label>
          <label>Ticket description <span class="hint">Optional. Paste it from Jira: Claude reads it from ticket.md.</span>
            <textarea id="np-desc" rows="5"></textarea></label>
        </div>
        <div id="np-alert"></div>
        <div class="row"><button class="btn primary" type="submit" id="np-create">Create</button></div>
      </div>
    </form>
  </div>
  <!-- ✓ Complete asks first (completed.js fills in the words) -->
  <div class="overlay" id="cp" hidden>
    <div class="modal small" role="alertdialog" aria-modal="true" aria-labelledby="cp-title" aria-describedby="cp-text">
      <header class="m-head"><div class="t"><h2 id="cp-title">Move to Completed?</h2></div>
        <button type="button" class="x" id="cp-cancel-x" aria-label="Close">×</button></header>
      <div class="np-body">
        <p id="cp-text"></p>
        <label id="cp-where" hidden>Folder for completed projects
          <input id="cp-folder" type="text" spellcheck="false" autocomplete="off">
          <span class="hint">Asked only once. The app puts a small hidden file in it and finds it from then on.
            Made if it is not there yet.</span></label>
        <div id="cp-alert"></div>
        <div class="row"><button type="button" class="btn complete" id="cp-yes">✓ Move to Completed</button>
          <button type="button" class="btn" id="cp-cancel">Cancel</button></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" hidden role="status"></div>

  <script src="{{ url_for('static', filename='paging.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script src="{{ url_for('static', filename='chat.js') }}"></script>
  <script src="{{ url_for('static', filename='card.js') }}"></script>
  <script src="{{ url_for('static', filename='todo.js') }}"></script>
  <script src="{{ url_for('static', filename='ideas.js') }}"></script>
  <script src="{{ url_for('static', filename='completed.js') }}"></script>
  <script src="{{ url_for('static', filename='newproject.js') }}"></script>
  <script src="{{ url_for('static', filename='slack.js') }}"></script>
</body>
</html>
